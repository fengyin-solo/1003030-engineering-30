# 端口等运行参数统一从根目录 .env 插值（docker compose 默认就读这个文件），
# 改 .env 后 docker compose up 即按新值生效。
services:
  backend:
    build: ./backend
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_PORT=${APP_PORT:-8000}
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 容器里 127.0.0.1 指向自身，代理目标用服务名；端口仍跟随 .env 的 APP_PORT
      - VITE_PROXY_TARGET=http://backend:${APP_PORT:-8000}
    depends_on:
      - backend
